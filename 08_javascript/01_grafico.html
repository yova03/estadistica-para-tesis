<!-- ============================================================
     EJEMPLO - JAVASCRIPT: grafico interactivo en tu navegador
     ============================================================

     Que es:
       JavaScript es el lenguaje de las paginas web. No se ejecuta
       "en el disco" como los demas: vive dentro del navegador.

     Como se prueba (NO necesitas instalar nada):
       1. Haz doble clic en este archivo (se abre en tu navegador).
       2. Pulsa los botones para cambiar el grafico.
       3. Cambia los numeros de las listas de abajo y guarda (Ctrl+S);
          recarga la pagina y veras el cambio.

     Fijate en: es el unico ejemplo que puedes USAR (hacer clic),
     no solo leer. Asi funcionan las encuestas y experimentos online
     de la investigacion (ejemplo: jsPsych).
     ============================================================ -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo de grafico con JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 30px auto;
            padding: 0 15px;
            color: #222;
        }
        button {
            padding: 8px 16px;
            margin-right: 8px;
            cursor: pointer;
            border: 1px solid #888;
            border-radius: 6px;
            background: #f2f2f2;
        }
        button:hover { background: #e0e0e0; }
        canvas { margin-top: 15px; border: 1px solid #ccc; border-radius: 6px; }
    </style>
</head>
<body>

    <h1>Peso y longitud por sitio</h1>
    <p>
        Este grafico lo dibuja JavaScript dentro de tu navegador.
        Pulsa un boton para ver cada variable:
    </p>

    <button onclick="dibujar('peso')">Ver peso (g)</button>
    <button onclick="dibujar('longitud')">Ver longitud (mm)</button>

    <canvas id="lienzo" width="640" height="400"></canvas>

    <script>
        // ----------------------------------------------------------
        // DATOS: cambia estos numeros y guarda (Ctrl+S), luego
        // recarga la pagina para ver el cambio.
        // ----------------------------------------------------------
        const datos = {
            peso: {
                titulo: "Peso promedio por sitio (g)",
                sitioA: [11.2, 12.4, 10.8, 12.1, 11.9, 12.6, 11.4, 12.2, 10.9, 11.7],
                sitioB: [14.8, 15.3, 14.1, 16.2, 15.0, 14.6, 15.8, 14.4, 15.5, 14.9],
            },
            longitud: {
                titulo: "Longitud promedio por sitio (mm)",
                sitioA: [46, 51, 44, 49, 47, 52, 45, 50, 43, 48],
                sitioB: [63, 67, 60, 70, 65, 62, 68, 61, 66, 64],
            },
        };

        // Funcion auxiliar: promedio de una lista de numeros
        function promedio(lista) {
            return lista.reduce((suma, v) => suma + v, 0) / lista.length;
        }

        // Funcion principal: dibuja el grafico de barras
        function dibujar(variable) {
            const info = datos[variable];
            const promedioA = promedio(info.sitioA);
            const promedioB = promedio(info.sitioB);

            const canvas = document.getElementById("lienzo");
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Margenes y area de dibujo
            const margen = { arriba: 50, abajo: 60, izquierda: 70, derecha: 30 };
            const ancho = canvas.width - margen.izquierda - margen.derecha;
            const alto = canvas.height - margen.arriba - margen.abajo;

            // Establecer la escala (el valor mas alto define la altura)
            const maximo = Math.max(promedioA, promedioB) * 1.3;
            const escala = alto / maximo;

            // Titulo
            ctx.fillStyle = "#222";
            ctx.font = "bold 16px Arial";
            ctx.textAlign = "center";
            ctx.fillText(info.titulo, canvas.width / 2, 28);

            // Ejes
            ctx.strokeStyle = "#444";
            ctx.beginPath();
            ctx.moveTo(margen.izquierda, margen.arriba);
            ctx.lineTo(margen.izquierda, margen.arriba + alto);
            ctx.lineTo(margen.izquierda + ancho, margen.arriba + alto);
            ctx.stroke();

            // Barras
            const barras = [
                { etiqueta: "Sitio A", valor: promedioA, color: "#4c72b0" },
                { etiqueta: "Sitio B", valor: promedioB, color: "#dd8452" },
            ];

            barras.forEach((barra, i) => {
                const anchoBarra = ancho / 3;
                const x = margen.izquierda + anchoBarra * (i + 0.5);
                const altura = barra.valor * escala;
                const y = margen.arriba + alto - altura;

                // Barra
                ctx.fillStyle = barra.color;
                ctx.fillRect(x, y, anchoBarra, altura);
                ctx.strokeStyle = "#333";
                ctx.strokeRect(x, y, anchoBarra, altura);

                // Numero encima de la barra
                ctx.fillStyle = "#222";
                ctx.font = "bold 14px Arial";
                ctx.textAlign = "center";
                ctx.fillText(barra.valor.toFixed(2), x + anchoBarra / 2, y - 8);

                // Etiqueta debajo
                ctx.font = "14px Arial";
                ctx.fillText(barra.etiqueta, x + anchoBarra / 2, margen.arriba + alto + 22);
            });
        }

        // Dibujar al abrir la pagina
        dibujar("peso");
    </script>

</body>
</html>
